[project]
name = "agentready"
version = "0.1.0"
description = "Cited, dated, agent-ready text from public Telangana government websites, plus accessibility scorecards."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.scripts]
agentready = "agentready.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pytest-httpserver>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentready"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# Module dependency contracts. Mirrors the layer table in docs/ARCHITECTURE.md.
# A module may import only from a lower layer. Modules in the same layer
# (separated by "|") are independent and may not import each other.
[tool.importlinter]
root_package = "agentready"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
exhaustive = true
layers = [
    "cli",
    "mcp_server | web_app",
    "query_api",
    "index | scorecard | fixkit",
    "site_directory | fetcher | normalizer | change_detector | a11y_auditor | agent_auditor",
    "store | crawl_policy | extract_html | extract_pdf | ocr",
    "core",
]
containers = ["agentready"]
